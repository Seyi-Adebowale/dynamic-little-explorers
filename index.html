<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Description, keywords, OG and Twitter tags are intentionally NOT
      hardcoded here — react-helmet-async can't remove/replace tags it
      didn't render itself, so a static tag here would end up duplicated
      alongside each page's own <Seo> tags. Every route supplies its own
      via src/components/layout/Seo.tsx.
    -->
    <title>Dynamic Little Explorers Montessori School | Crèche, Toddler &amp; Preschool</title>
    <meta name="author" content="Dynamic Little Explorers Montessori School" />
    <meta name="theme-color" content="#c73b78" />
    <meta name="format-detection" content="telephone=no, address=no, email=no, date=no" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
